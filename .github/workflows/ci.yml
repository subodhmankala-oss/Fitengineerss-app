# Lint + tests on every PR (and on main), so a lint error or a failing test
# shows up as a failed check before merge instead of piling up again.
# ESLint was brought to zero in #277; tests don't need secrets (vite.config.js
# gives them placeholder Supabase settings).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR/branch cancels the older, now-stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Same major version Vercel builds production with (project setting: 24.x).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test
