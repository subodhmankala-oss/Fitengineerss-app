<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- maximum-scale=1 + user-scalable=no stop iOS Safari from auto-zooming the
         whole page when a form field is focused. That auto-zoom is what was
         leaving the Coach/Client dashboard stuck "zoomed in" after login —
         capping the scale here is the permanent fix, independent of any
         individual input's font-size. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#090d16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fitengineers" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>fitengineers-app</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
