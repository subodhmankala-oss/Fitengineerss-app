<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- maximum-scale=1 + user-scalable=no stop iOS Safari from auto-zooming the
         whole page when a form field is focused. That auto-zoom is what was
         leaving the Coach/Client dashboard stuck "zoomed in" after login —
         capping the scale here is the permanent fix, independent of any
         individual input's font-size.
         viewport-fit=cover lets the app draw under the notch/home-indicator
         area so env(safe-area-inset-*) has real values to work with. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1220" />

    <!-- iOS "Add to Home Screen" behavior -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- ROOT CAUSE FIX 2026-08-19: this was `black-translucent`, which is an
         explicit opt-in to rendering web content FULL SCREEN, underneath the
         iOS status bar. That single line is the origin of the whole
         status-bar-overlap class of bugs: the app drew beneath the clock and
         then had to manually re-pad itself back out via
         env(safe-area-inset-top) — a value iOS is documented to report as 0
         under black-translucent, and which WebKit additionally re-zeroes
         while an input-method panel (keyboard, emoji picker) is open.
         Every prior fix here fought that symptom (a JS snapshot probe, then
         hardcoded px floors) instead of the cause, and each one broke on the
         next device whose status bar was a different height.
         `default` makes iOS reserve the status bar region itself, so content
         physically cannot render under it — correct at every device size,
         with no measurement and no magic numbers. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fitengineers" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- iOS splash screens (shown while the standalone app launches). One
         per device resolution — Safari only honors the entry whose media
         query matches, so all of these must be listed. -->

      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
