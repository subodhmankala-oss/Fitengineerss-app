<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1220" />
    <title>You're offline · Fitengineers</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        background: #0B1220;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Outfit, Roboto, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px;
        padding-top: max(32px, env(safe-area-inset-top));
        padding-bottom: max(32px, env(safe-area-inset-bottom));
        gap: 16px;
      }
      img {
        width: 72px;
        height: 72px;
        opacity: 0.9;
        margin-bottom: 8px;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        color: #94a3b8;
        font-size: 0.95rem;
        max-width: 320px;
        line-height: 1.5;
      }
      button {
        margin-top: 12px;
        padding: 12px 28px;
        border-radius: 9999px;
        border: none;
        background: #059669;
        color: #f8fafc;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        background: #047857;
      }
    </style>
  </head>
  <body>
    <img src="/logo.png" alt="Fitengineers" />
    <h1>You're offline</h1>
    <p>No internet connection right now. Pages you've already opened may still work — everything else needs a connection to sync with your coach.</p>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
