<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 369.03" width="200" height="369.03">
  <!-- Bust for the female heat-map figure (front view), drawn for this app on the canvas of
       body-front.svg as warped by femaleBodyWarp.js. Shading only — no solid fill — so the chest
       keeps the artwork's own muscle detail and the bust blends into it: soft tissue tone over the
       lower pectorals, a highlight for volume, and blurred shadows along the under-crease, the
       outer sides and the cleavage. The lower edge follows the warped muscle-4.svg. Rendered under
       the muscle overlays, so a colored Chest tints it while the shading still shows the shape. -->
  <defs>
    <filter id="blurL" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <filter id="blurM" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="blurS" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0.9"/></filter>
  </defs>
  <!-- tissue tone: softens (doesn't erase) the pec striations where the breast sits -->
  <g filter="url(#blurL)" fill="#efefef" fill-opacity="0.32">
    <path d="M69,98 C69,90 76,87.5 83,88 C90,88.5 96,92 96.5,99 C97,106 91,111 83,111 C75,111 69,106 69,98 Z"/>
    <path d="M129.6,98 C129.6,90 122.6,87.5 115.6,88 C108.6,88.5 102.6,92 102.1,99 C101.6,106 107.6,111 115.6,111 C123.6,111 129.6,106 129.6,98 Z"/>
  </g>
  <!-- volume highlight, upper-inner of each -->
  <g filter="url(#blurM)" fill="#ffffff" fill-opacity="0.55">
    <ellipse cx="83.5" cy="98.5" rx="6.5" ry="5"/>
    <ellipse cx="115.1" cy="98.5" rx="6.5" ry="5"/>
  </g>
  <!-- lower-half shading, so each reads round rather than flat -->
  <g filter="url(#blurM)" fill="#000" fill-opacity="0.09">
    <path d="M70.5,101 C73,108 78,111.5 83,111.5 C89,111.5 94,108 96,102 C92,106 88,107.5 83,107.5 C78,107.5 73.5,105 70.5,101 Z"/>
    <path d="M128.1,101 C125.6,108 120.6,111.5 115.6,111.5 C109.6,111.5 104.6,108 102.6,102 C106.6,106 110.6,107.5 115.6,107.5 C120.6,107.5 125.1,105 128.1,101 Z"/>
  </g>
  <!-- under-crease, outer side and cleavage shadows -->
  <g filter="url(#blurS)" fill="none" stroke="#000" stroke-linecap="round">
    <path stroke-opacity="0.38" stroke-width="2.3" d="M70.5,104 C73.5,109.5 78,112 83,112 C88.5,112 93,109.5 96,105.5"/>
    <path stroke-opacity="0.38" stroke-width="2.3" d="M128.1,104 C125.1,109.5 120.6,112 115.6,112 C110.1,112 105.6,109.5 102.6,105.5"/>
    <path stroke-opacity="0.2" stroke-width="2.4" d="M68.5,91 C67.5,95 68,100 70.5,104"/>
    <path stroke-opacity="0.2" stroke-width="2.4" d="M130.1,91 C131.1,95 130.6,100 128.1,104"/>
    <path stroke-opacity="0.22" stroke-width="1.5" d="M99.3,99 C99.1,102 99.1,105 99.3,107.5"/>
  </g>
</svg>
