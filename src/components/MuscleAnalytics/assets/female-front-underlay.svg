<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 369.03" width="200" height="369.03">
  <!-- Bust for the female heat-map figure (front view), drawn for this app on the canvas of
       body-front.svg as warped by femaleBodyWarp.js. Shading only — no solid fill — so the chest
       keeps the artwork's own muscle detail and the bust blends into it: soft tissue tone over the
       lower pectorals, a highlight for volume, and blurred shadows along the under-crease, the
       outer sides and the cleavage. The under-crease sits exactly on the lower edge of the warped muscle-4.svg
       (measured; the two sides aren't mirror images), so it doesn't draw a second line. Rendered under
       the muscle overlays, so a colored Chest tints it while the shading still shows the shape. -->
  <defs>
    <filter id="blurL" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <filter id="blurM" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="blurS" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="0.9"/></filter>
  </defs>
  <!-- tissue tone: softens (doesn't erase) the pec striations where the breast sits -->
  <g filter="url(#blurL)" fill="#efefef" fill-opacity="0.32">
    <path d="M69,96 C69,88.5 76,86 83,86.5 C90,87 96,90.5 96.5,97 C97,103.5 91,108.2 83,108.2 C75,108.2 69,103.5 69,96 Z"/>
    <path d="M129.6,96.5 C129.6,89 123,86.5 116.5,87 C109.5,87.5 103,91 102.5,97.5 C102,104 108,109 116.5,109 C124,109 129.6,104 129.6,96.5 Z"/>
  </g>
  <!-- volume highlight, upper-inner of each -->
  <g filter="url(#blurM)" fill="#ffffff" fill-opacity="0.55">
    <ellipse cx="83" cy="96" rx="6.5" ry="5"/>
    <ellipse cx="116" cy="96.5" rx="6.5" ry="5"/>
  </g>
  <!-- lower-half shading, so each reads round rather than flat -->
  <g filter="url(#blurM)" fill="#000" fill-opacity="0.09">
    <path d="M70,98.5 C72.5,104.5 77.5,108 83,108 C88.5,108 93,105.5 95.5,101.5 C92,104 88,105 83,105 C78,105 73,102.5 70,98.5 Z"/>
    <path d="M128.5,99.5 C126,105.5 122,109 117.5,109 C111.5,109 106.5,106.5 103,102 C106.5,104.5 111.5,106 117.5,106 C122.5,106 126,103.5 128.5,99.5 Z"/>
  </g>
  <!-- under-crease, outer side and cleavage shadows -->
  <g filter="url(#blurS)" fill="none" stroke="#000" stroke-linecap="round">
    <path stroke-opacity="0.38" stroke-width="2.3" d="M69.5,99.5 C72,105 77,108.6 83,108.6 C88.5,108.6 92.5,106 95.5,102"/>
    <path stroke-opacity="0.38" stroke-width="2.3" d="M129,100.5 C126.5,106 122,109.4 117.5,109.4 C111.5,109.4 106.5,107 102.5,102.5"/>
    <path stroke-opacity="0.2" stroke-width="2.4" d="M68.5,88 C67.5,92 68,96 69.5,99.5"/>
    <path stroke-opacity="0.2" stroke-width="2.4" d="M130.1,89 C131.1,93 130.6,97 129,100.5"/>
    <path stroke-opacity="0.22" stroke-width="1.5" d="M99.3,97 C99.1,100 99.1,102.5 99.3,105"/>
  </g>
</svg>
